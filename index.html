<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>band-schedule | 吹奏楽部 日程調整</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a22; --surface2: #22222e;
      --border: #2e2e3e; --accent: #7c6af7; --text: #e8e8f0;
      --text-muted: #7a7a96; --ok: #5ec77a; --late: #f7c26a;
      --ng: #f76a6a; --tbd: #7a7a96;
    }
    body.light-mode {
      --bg: #f4f4f8; --surface: #ffffff; --surface2: #ebebf2;
      --border: #d0d0e0; --accent: #7c6af7; --text: #1a1a2e;
      --text-muted: #6b6b8a; --ok: #2e9e55; --late: #c47f00;
      --ng: #d63030; --tbd: #8888aa;
    }
    /* 設定モーダル */
    .settings-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 6px; padding: 4px 10px; font-size: 18px; cursor: pointer;
      transition: border-color .2s, color .2s; line-height: 1;
    }
    .settings-btn:hover { border-color: var(--accent); color: var(--text); }
    .settings-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; z-index: 300;
    }
    .settings-modal.open { display: flex; }
    .settings-inner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; width: 320px;
    }
    .settings-inner h3 { font-size:16px; margin-bottom:20px; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .toggle-row label { font-size:13px; }
    .toggle { position:relative; width:44px; height:24px; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle-slider {
      position:absolute; inset:0; background:var(--border); border-radius:24px; cursor:pointer; transition:.3s;
    }
    .toggle-slider:before {
      content:''; position:absolute; width:18px; height:18px; left:3px; bottom:3px;
      background:#fff; border-radius:50%; transition:.3s;
    }
    .toggle input:checked + .toggle-slider { background:var(--accent); }
    .toggle input:checked + .toggle-slider:before { transform:translateX(20px); }
    body { font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }

    /* LOGIN */
    #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 30% 40%,#1e1560 0%,transparent 60%),radial-gradient(ellipse at 70% 70%,#1a0f2e 0%,transparent 50%),var(--bg); }
    .login-card { width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px 36px; }
    .login-card h1 { font-family:'DM Serif Display',serif; font-size:26px; color:var(--accent); margin-bottom:4px; }
    .login-card .subtitle { color:var(--text-muted); font-size:12px; margin-bottom:32px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
    .form-group input, .form-group select {
      width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:10px 14px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:14px; outline:none; transition:border-color .2s;
    }
    .form-group input:focus,.form-group select:focus { border-color:var(--accent); }
    .form-group select option { background:var(--surface2); }
    .btn { width:100%; padding:12px; border-radius:8px; border:none; font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:opacity .2s,transform .1s; }
    .btn:active { transform:scale(.98); }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { opacity:.9; }
    .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
    .btn-secondary:hover { border-color:var(--accent); }
    .btn-row { display:flex; gap:8px; margin-bottom:8px; }
    .btn-row .btn { margin:0; }
    #admin-password-group { display:none; }
    #profile-section { display:none; margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
    .error-msg { color:#f76a6a; font-size:12px; margin-top:8px; display:none; }

    /* APP */
    #app { display:none; }
    .header { background:var(--surface); border-bottom:1px solid var(--border); padding:0 12px; height:auto; min-height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:8px; padding-top:8px; padding-bottom:8px; }
    .header-title { font-family:'DM Serif Display',serif; color:var(--accent); font-size:18px; white-space:nowrap; }
    .header-user { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .user-badge { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 10px; font-size:11px; color:var(--text-muted); white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis; }
    .user-badge span { color:var(--text); font-weight:500; }
    .logout-btn { background:none; border:1px solid var(--border); color:var(--text-muted); border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; font-family:'Noto Sans JP',sans-serif; transition:border-color .2s,color .2s; white-space:nowrap; }
    .logout-btn:hover { border-color:var(--accent); color:var(--text); }

    /* TABS */
    .tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; }
    .tab { padding:14px 20px; font-size:13px; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; transition:color .2s,border-color .2s; }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .tab:hover { color:var(--text); }

    /* MAIN */
    .main { padding:16px; max-width:1100px; margin:0 auto; }
    .panel { display:none; }
    .panel.active { display:block; }

    /* CALENDAR HEADER */
    .calendar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .section-title { font-size:16px; font-weight:500; }
    .calendar-nav { display:flex; align-items:center; gap:16px; }
    .nav-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:border-color .2s; }
    .nav-btn:hover { border-color:var(--accent); }
    .month-label { font-size:18px; font-weight:500; min-width:120px; text-align:center; }

    /* MY CALENDAR - インライン入力型 */
    .my-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 80px));
      gap: 6px;
      justify-content: center;
    }

    .day-header { text-align:center; font-size:12px; color:var(--text-muted); padding:8px 0; font-weight:500; }
    .day-header.sun { color:#f76a6a; }
    .day-header.sat { color:#6a9af7; }

    /* 日付セル：縦長、ボタンを常時表示 */
    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color .2s;
    }
    .day-card.empty { background:transparent; border-color:transparent; }
    .day-card.today { border-color:var(--accent); }
    .day-card.sun .day-num { color:#f76a6a; }
    .day-card.sat .day-num { color:#6a9af7; }

    .day-num { font-size:14px; font-weight:600; line-height:1; }

    /* ステータスボタン 縦4つ */
    .inline-btns {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .inline-btn {
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 6px;
      font-size: 14px;
      padding: 8px 0;
      cursor: pointer;
      color: var(--text-muted);
      font-family: 'Noto Sans JP', sans-serif;
      transition: border-color .15s, color .15s, background .15s;
      text-align: center;
      line-height: 1;
      width: 100%;
    }
    .inline-btn:hover { background: var(--surface); }

    /* 選択済みスタイル */
    .inline-btn.sel-ok   { border-color:var(--ok);   color:var(--ok);   background:#0d2e18; }
    .inline-btn.sel-late { border-color:var(--late); color:var(--late); background:#2e200a; }
    .inline-btn.sel-ng   { border-color:var(--ng);   color:var(--ng);   background:#2e0d0d; }
    .inline-btn.sel-tbd  { border-color:var(--tbd);  color:var(--tbd);  background:#1a1a22; }

    /* 備考欄（△選択時に展開） */
    .note-inline {
      width: 100%;
      display: none;
    }
    .note-inline.open { display: block; }
    .note-inline input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--late);
      border-radius: 4px;
      padding: 3px 6px;
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 10px;
      outline: none;
    }

    /* OVERVIEW */
    .overview-table-wrap { overflow-x:auto; }
    .overview-table { width:100%; border-collapse:collapse; font-size:12px; }
    .overview-table th { background:var(--surface2); padding:8px 10px; text-align:center; color:var(--text-muted); font-weight:500; border-bottom:1px solid var(--border); white-space:nowrap; }
    .overview-table th.left { text-align:left; }
    .overview-table td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:center; white-space:nowrap; }
    .overview-table td.left { text-align:left; }
    .overview-table tr:hover td { background:var(--surface2); }
    .status-ok { color:var(--ok); }
    .status-late { color:var(--late); }
    .status-ng { color:var(--ng); }
    .status-tbd { color:var(--tbd); }

    /* ADMIN */
    .admin-section { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:20px; }
    .admin-section h3 { font-size:12px; font-weight:500; margin-bottom:16px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; }
    .part-list { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; min-height:32px; }
    .part-tag { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:12px; display:flex; align-items:center; gap:8px; }
    .part-tag-del { color:var(--text-muted); cursor:pointer; font-size:14px; line-height:1; transition:color .2s; }
    .part-tag-del:hover { color:var(--ng); }
    .add-part-row { display:flex; gap:8px; }
    .add-part-row input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:13px; outline:none; }
    .add-part-row input:focus { border-color:var(--accent); }
    .add-part-row .btn { width:auto; padding:8px 16px; }
    .loading { text-align:center; padding:40px; color:var(--text-muted); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>🎺 band-schedule</h1>
    <p class="subtitle">吹奏楽部 日程調整ツール</p>

    <!-- モード選択 -->
    <div id="mode-select" style="margin-bottom:24px;">
      <div class="btn-row">
        <button class="btn btn-primary" id="mode-login-btn">ログイン</button>
        <button class="btn btn-secondary" id="mode-register-btn">新規登録</button>
      </div>
      <div style="margin-top:12px;text-align:center;">
        <button class="btn btn-secondary" id="admin-toggle-btn" style="font-size:12px;padding:6px;">管理者ログイン</button>
      </div>
    </div>

    <!-- ログインフォーム -->
    <div id="login-form" style="display:none;">
      <div class="form-group">
        <label>アカウント名</label>
        <input type="text" id="account-input" placeholder="例：yamada_taro">
      </div>
      <button class="btn btn-primary" id="login-btn">ログイン</button>
      <p style="font-size:12px;color:var(--text-muted);margin-top:10px;cursor:pointer;text-align:center;" id="back-to-mode-login">← 戻る</p>
    </div>

    <!-- 新規登録フォーム -->
    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label>アカウント名</label>
        <input type="text" id="register-account-input" placeholder="例：yamada_taro">
      </div>
      <div class="form-group">
        <label>名前</label>
        <input type="text" id="name-input" placeholder="例：山田 太郎">
      </div>
      <div class="form-group">
        <label>パート</label>
        <select id="part-select"><option value="">パートを選択</option></select>
      </div>
      <button class="btn btn-primary" id="save-profile-btn">登録してログイン</button>
      <p style="font-size:12px;color:var(--text-muted);margin-top:10px;cursor:pointer;text-align:center;" id="back-to-mode-register">← 戻る</p>
    </div>

    <!-- 管理者フォーム -->
    <div id="admin-form" style="display:none;">
      <div class="form-group">
        <label>アカウント名</label>
        <input type="text" id="admin-account-input" placeholder="例：yamada_taro">
      </div>
      <div class="form-group">
        <label>管理者パスワード</label>
        <input type="password" id="admin-pw-input" placeholder="パスワードを入力">
      </div>
      <button class="btn btn-primary" id="admin-login-btn">管理者ログイン</button>
      <p style="font-size:12px;color:var(--text-muted);margin-top:10px;cursor:pointer;text-align:center;" id="back-to-mode-admin">← 戻る</p>
    </div>

    <p class="error-msg" id="login-error"></p>
    <!-- 互換性のための非表示要素 -->
    <div id="admin-password-group" style="display:none;"></div>
    <div id="profile-section" style="display:none;"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="header-title">🎺 band-schedule</div>
      <button class="settings-btn" id="settings-btn">⚙️</button>
    </div>
    <div class="header-user">
      <div class="user-badge"><span id="badge-name">-</span> / <span id="badge-part">-</span></div>
      <button class="logout-btn" id="logout-btn">ログアウト</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="my-schedule">マイスケジュール</div>
    <div class="tab" data-tab="overview">全体カレンダー</div>
    <div class="tab" data-tab="practice">練習日程</div>
    <div class="tab" data-tab="admin" id="admin-tab" style="display:none;">管理者</div>
  </div>
  <div class="main">

    <!-- マイスケジュール -->
    <div class="panel active" id="panel-my-schedule">
      <div class="calendar-header">
        <p class="section-title">スケジュール登録</p>
        <div class="calendar-nav">
          <button class="nav-btn" id="prev-month">‹</button>
          <div class="month-label" id="month-label"></div>
          <button class="nav-btn" id="next-month">›</button>
        </div>
      </div>
      <div class="my-cal-grid" id="my-calendar"></div>
    </div>

    <!-- 全体カレンダー -->
    <div class="panel" id="panel-overview">
      <div class="calendar-header">
        <p class="section-title">全体カレンダー</p>
        <div class="calendar-nav">
          <button class="nav-btn" id="prev-month-ov">‹</button>
          <div class="month-label" id="month-label-ov"></div>
          <button class="nav-btn" id="next-month-ov">›</button>
        </div>
      </div>
      <div id="detail-panel" style="display:none; background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:20px; margin-bottom:16px;">
        <h3 id="detail-panel-title" style="font-size:15px; margin-bottom:14px;"></h3>
        <div id="detail-panel-content"></div>
      </div>
      <div id="overview-content"><p class="loading">読み込み中...</p></div>
    </div>

    <!-- 練習日程 -->
    <div class="panel" id="panel-practice">
      <div id="practice-content"></div>
    </div>

    <!-- 管理者 -->
    <div class="panel" id="panel-admin">
      <div class="admin-section">
        <h3>パート管理</h3>
        <div class="part-list" id="part-list"></div>
        <div class="add-part-row">
          <input type="text" id="new-part-input" placeholder="新しいパート名">
          <button class="btn btn-primary" id="add-part-btn">追加</button>
        </div>
      </div>
      <div class="admin-section" id="user-admin-section" style="display:none;">
        <h3>ユーザー管理</h3>
        <div id="user-list-admin"></div>
      </div>

      <div class="admin-section" id="pw-admin-section" style="display:none;">
        <h3>管理者パスワード変更</h3>
        <div class="form-group">
          <label>現在のパスワード</label>
          <input type="password" id="current-pw-input" placeholder="現在のパスワード">
        </div>
        <div class="form-group">
          <label>新しいパスワード</label>
          <input type="password" id="new-pw-input" placeholder="新しいパスワード">
        </div>
        <div class="form-group">
          <label>新しいパスワード（確認）</label>
          <input type="password" id="new-pw-confirm-input" placeholder="もう一度入力">
        </div>
        <button class="btn btn-primary" id="change-pw-btn">パスワードを変更する</button>
        <p id="pw-change-msg" style="font-size:12px;margin-top:8px;display:none;"></p>
      </div>

      <div class="admin-section" id="venue-admin-section" style="display:none;">
        <h3>場所管理</h3>
        <div class="part-list" id="venue-list"></div>
        <div class="add-part-row">
          <input type="text" id="new-venue-input" placeholder="新しい場所名">
          <button class="btn btn-primary" id="add-venue-btn">追加</button>
        </div>
      </div>
      <div class="admin-section" id="practice-admin-section" style="display:none;">
        <h3>練習日程の登録</h3>
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="practice-date-input">
        </div>
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="practice-start-input">
        </div>
        <div class="form-group">
          <label>終了時間</label>
          <input type="time" id="practice-end-input">
        </div>
        <div class="form-group">
          <label>場所</label>
          <select id="practice-venue-input"><option value="">場所を選択</option></select>
        </div>
        <div class="form-group">
          <label>曲名</label>
          <input type="text" id="practice-song-input" placeholder="例：Jupiter、マーチ〇〇">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" id="practice-ensemble-input" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);">
          <label for="practice-ensemble-input" style="cursor:pointer;margin:0;">アンサンブル</label>
        </div>
        <button class="btn btn-primary" id="add-practice-btn">登録する</button>
      </div>
    </div>

  </div>
</div>

<!-- 設定モーダル -->
<div class="settings-modal" id="settings-modal">
  <div class="settings-inner">
    <h3>⚙️ 設定</h3>
    <div class="toggle-row">
      <label>ライトモード</label>
      <label class="toggle">
        <input type="checkbox" id="light-mode-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div style="padding-top:16px;">
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">プロフィール変更</p>
      <div class="form-group">
        <label>名前</label>
        <input type="text" id="settings-name-input">
      </div>
      <div class="form-group">
        <label>パート</label>
        <select id="settings-part-select"><option value="">パートを選択</option></select>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn btn-primary" id="save-settings-btn" style="margin:0;">保存</button>
        <button class="btn btn-secondary" id="close-settings-btn" style="margin:0;">閉じる</button>
      </div>
      <p id="settings-msg" style="font-size:12px;margin-top:8px;display:none;"></p>
    </div>
  </div>
</div>

<!-- 練習日程編集モーダル -->
<div class="settings-modal" id="edit-practice-modal">
  <div class="settings-inner" style="width:340px;">
    <h3 style="margin-bottom:16px;">✏️ 練習日程を編集</h3>
    <div class="form-group">
      <label>日付</label>
      <input type="date" id="edit-practice-date">
    </div>
    <div class="form-group">
      <label>開始時間</label>
      <input type="time" id="edit-practice-start">
    </div>
    <div class="form-group">
      <label>終了時間</label>
      <input type="time" id="edit-practice-end">
    </div>
    <div class="form-group">
      <label>場所</label>
      <select id="edit-practice-venue"><option value="">場所を選択</option></select>
    </div>
    <div class="form-group">
      <label>曲名</label>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function() {
  // Firebase初期化
  const firebaseConfig = {
    apiKey: "AIzaSyAZDo15-Fy4Wp2cESpQMYeryI_XzJy6zik",
    authDomain: "band-schedule-c77cb.firebaseapp.com",
    projectId: "band-schedule-c77cb",
    storageBucket: "band-schedule-c77cb.firebasestorage.app",
    messagingSenderId: "303528983553",
    appId: "1:303528983553:web:c8c501f39b2b6ff70bd400"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  var ADMIN_PASSWORD = "band2024admin";

  let currentUser = null;
  let isAdmin = false;
  let currentMonth = new Date();
  let currentMonthOv = new Date();
  let parts = [];
  let saveTimer = {};  // 日付ごとの保存タイマー

  const statusEmoji = { ok:'◯', late:'△', ng:'×', tbd:'ー' };
  const statusCls   = { ok:'status-ok', late:'status-late', ng:'status-ng', tbd:'status-tbd' };

  // ---- UTILS ----
  function showError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg; el.style.display = 'block';
  }
  function hideError() { document.getElementById('login-error').style.display = 'none'; }

  // ---- EVENTS ----
  // ---- LOGIN MODE ----
  function showLoginMode(mode) {
    document.getElementById('mode-select').style.display   = mode === '' ? 'block' : 'none';
    document.getElementById('login-form').style.display    = mode === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('admin-form').style.display    = mode === 'admin' ? 'block' : 'none';
    hideError();
  }

  // モード切替
  document.getElementById('mode-login-btn').addEventListener('click', function() {
    showLoginMode('login');
  });
  document.getElementById('mode-register-btn').addEventListener('click', async function() {
    await loadParts();
    populatePartSelect();
    showLoginMode('register');
  });
  document.getElementById('admin-toggle-btn').addEventListener('click', function() {
    showLoginMode('admin');
  });
  document.getElementById('back-to-mode-login').addEventListener('click', function() { showLoginMode(''); });
  document.getElementById('back-to-mode-register').addEventListener('click', function() { showLoginMode(''); });
  document.getElementById('back-to-mode-admin').addEventListener('click', function() { showLoginMode(''); });

  document.getElementById('login-btn').addEventListener('click', handleLogin);
  document.getElementById('account-input').addEventListener('keydown', function(e) { if(e.key==='Enter') handleLogin(); });
  document.getElementById('admin-login-btn').addEventListener('click', handleAdminLogin);
  document.getElementById('admin-pw-input').addEventListener('keydown', function(e) { if(e.key==='Enter') handleAdminLogin(); });
  document.getElementById('save-profile-btn').addEventListener('click', saveProfile);
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('prev-month').addEventListener('click', function() { changeMonth(-1); });
  document.getElementById('next-month').addEventListener('click', function() { changeMonth(1); });
  document.getElementById('prev-month-ov').addEventListener('click', function() { changeMonthOv(-1); });
  document.getElementById('next-month-ov').addEventListener('click', function() { changeMonthOv(1); });
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() { switchTab(this.dataset.tab); });
    tab.addEventListener('touchend', function(e) { e.preventDefault(); switchTab(this.dataset.tab); });
  });
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('close-settings-btn').addEventListener('click', function() {
    document.getElementById('settings-modal').classList.remove('open');
  });
  document.getElementById('save-settings-btn').addEventListener('click', saveSettings);
  document.getElementById('light-mode-toggle').addEventListener('change', function() {
    document.body.classList.toggle('light-mode', this.checked);
    localStorage.setItem('lightMode', this.checked ? '1' : '0');
  });
  // ライトモードの初期化
  if (localStorage.getItem('lightMode') === '1') {
    document.body.classList.add('light-mode');
    document.getElementById('light-mode-toggle').checked = true;
  }
  document.getElementById('close-edit-practice-btn').addEventListener('click', function() {
    document.getElementById('edit-practice-modal').classList.remove('open');
  });
  document.getElementById('save-edit-practice-btn').addEventListener('click', saveEditPractice);
  document.getElementById('delete-edit-practice-btn').addEventListener('click', deleteEditPractice);
  document.getElementById('add-part-btn').addEventListener('click', addPart);
  document.getElementById('change-pw-btn').addEventListener('click', changePassword);
  document.getElementById('add-venue-btn').addEventListener('click', addVenue);
  document.getElementById('new-venue-input').addEventListener('keydown', function(e) { if(e.key==='Enter') addVenue(); });
  document.getElementById('add-practice-btn').addEventListener('click', addPractice);


  document.getElementById('new-part-input').addEventListener('keydown', function(e) { if(e.key==='Enter') addPart(); });

  // ---- LOGIN ----
  async function handleLogin() {
    var account = document.getElementById('account-input').value.trim();
    hideError();
    if (!account) { showError('アカウント名を入力してください'); return; }
    try {
      await loadParts();
      await loadAdminPassword();
      await loadVenues();
      await loadPractices();
      var snap = await db.collection('users').doc(account).get();
      if (snap.exists) {
        currentUser = { account: account, name: snap.data().name, part: snap.data().part, schedules: snap.data().schedules || {} };
        enterApp();
      } else {
        showError('アカウントが見つかりません。新規登録してください。');
      }
    } catch(e) { showError('エラー: ' + e.message); }
  }

  async function handleAdminLogin() {
    var account = document.getElementById('admin-account-input').value.trim();
    var adminPw = document.getElementById('admin-pw-input').value;
    hideError();
    if (!account) { showError('アカウント名を入力してください'); return; }
    try {
      await loadAdminPassword();
      if (adminPw !== ADMIN_PASSWORD) { showError('パスワードが違います'); return; }
      await loadParts();
      await loadVenues();
      await loadPractices();
      var snap = await db.collection('users').doc(account).get();
      if (!snap.exists) { showError('アカウントが見つかりません'); return; }
      isAdmin = true;
      currentUser = { account: account, name: snap.data().name, part: snap.data().part, schedules: snap.data().schedules || {} };
      enterApp();
    } catch(e) { showError('エラー: ' + e.message); }
  }

  async function saveProfile() {
    var account = document.getElementById('register-account-input').value.trim();
    var name    = document.getElementById('name-input').value.trim();
    var part    = document.getElementById('part-select').value;
    hideError();
    if (!account) { showError('アカウント名を入力してください'); return; }
    if (!name)    { showError('名前を入力してください'); return; }
    if (!part)    { showError('パートを選択してください'); return; }
    try {
      await loadParts();
      await loadAdminPassword();
      await loadVenues();
      await loadPractices();
      var existing = await db.collection('users').doc(account).get();
      if (existing.exists) { showError('このアカウント名はすでに使われています'); return; }
      var data = { name: name, part: part, schedules: {} };
      await db.collection('users').doc(account).set(data);
      currentUser = { account: account, name: name, part: part, schedules: {} };
      enterApp();
    } catch(e) { showError('エラー: ' + e.message); }
  }

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('badge-name').textContent = currentUser.name;
    document.getElementById('badge-part').textContent = currentUser.part;
    if (isAdmin) {
      document.getElementById('admin-tab').style.display = 'block';
      document.getElementById('user-admin-section').style.display = 'block';
      document.getElementById('pw-admin-section').style.display = 'block';
      document.getElementById('venue-admin-section').style.display = 'block';
      document.getElementById('practice-admin-section').style.display = 'block';
    }
    renderMyCalendar();
    renderPractice();
  }

  function logout() {
    currentUser = null; isAdmin = false;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('admin-tab').style.display = 'none';
    document.getElementById('account-input').value = '';
    document.getElementById('register-account-input').value = '';
    document.getElementById('admin-account-input').value = '';
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('name-input').value = '';
    showLoginMode('');
    hideError();
    switchTab('my-schedule');
  }

  // ---- PARTS ----
  async function loadParts() {
    const snap = await db.collection('settings').doc('parts').get();
    if (snap.exists && snap.data().list) {
      parts = snap.data().list;
    } else {
      parts = ['フルート','クラリネット','サックス','トランペット','トロンボーン','ホルン','ユーフォニアム','チューバ','パーカッション'];
      await db.collection('settings').doc('parts').set({ list: parts });
    }
  }

  function populatePartSelect() {
    const sel = document.getElementById('part-select');
    sel.innerHTML = '<option value="">パートを選択</option>';
    parts.forEach(function(p) {
      const o = document.createElement('option');
      o.value = p; o.textContent = p; sel.appendChild(o);
    });
  }

  // ---- MY CALENDAR（インライン入力型） ----
  function changeMonth(d) {
    currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + d, 1);
    renderMyCalendar();
  }

  function renderMyCalendar() {
    const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
    document.getElementById('month-label').textContent = y + '年' + (m+1) + '月';
    const grid = document.getElementById('my-calendar');
    grid.innerHTML = '';

    // 曜日ヘッダー
    ['日','月','火','水','木','金','土'].forEach(function(d, i) {
      const h = document.createElement('div');
      h.className = 'day-header' + (i===0?' sun':i===6?' sat':'');
      h.textContent = d; grid.appendChild(h);
    });

    const firstDow = new Date(y, m, 1).getDay();
    const lastDay  = new Date(y, m+1, 0).getDate();
    const today    = new Date();
    const schedules = currentUser.schedules || {};

    // 空白セル
    for (let i = 0; i < firstDow; i++) {
      const e = document.createElement('div'); e.className = 'day-card empty'; grid.appendChild(e);
    }

    // 日付セル
    for (let d = 1; d <= lastDay; d++) {
      const dow = new Date(y, m, d).getDay();
      const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
      const key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const entry = schedules[key] || null;

      const card = document.createElement('div');
      card.className = 'day-card' + (dow===0?' sun':dow===6?' sat':'') + (isToday?' today':'');
      card.dataset.key = key;

      // 日付番号
      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      card.appendChild(num);

      // ステータスボタン4つ
      const btns = document.createElement('div');
      btns.className = 'inline-btns';

      ['ok','late','ng','tbd'].forEach(function(s) {
        const btn = document.createElement('button');
        btn.className = 'inline-btn' + (entry && entry.status === s ? ' sel-'+s : '');
        btn.textContent = statusEmoji[s];
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          handleInlineStatus(key, s, card);
        });
        btns.appendChild(btn);
      });
      card.appendChild(btns);

      // 備考欄（△選択時のみ表示）
      const noteWrap = document.createElement('div');
      noteWrap.className = 'note-inline' + (entry && entry.status === 'late' ? ' open' : '');
      const noteInput = document.createElement('input');
      noteInput.type = 'text';
      
      noteInput.value = (entry && entry.note) ? entry.note : '';
      noteInput.addEventListener('input', function() {
        scheduleSave(key, 'late', noteInput.value);
      });
      noteWrap.appendChild(noteInput);
      card.appendChild(noteWrap);

      grid.appendChild(card);
    }
  }

  // ステータスをインラインで選択
  function handleInlineStatus(key, status, card) {
    if (!currentUser.schedules) currentUser.schedules = {};

    const current = currentUser.schedules[key];

    // 同じステータスをもう一度タップ → 解除
    if (current && current.status === status) {
      delete currentUser.schedules[key];
      saveSchedule();
      renderMyCalendar();
      return;
    }

    currentUser.schedules[key] = { status: status, note: '' };
    saveSchedule();

    // ボタンの見た目を即座に更新
    const allBtns = card.querySelectorAll('.inline-btn');
    allBtns.forEach(function(b, i) {
      const s = ['ok','late','ng','tbd'][i];
      b.className = 'inline-btn' + (s === status ? ' sel-'+s : '');
    });

    // 備考欄の表示切り替え
    const noteWrap = card.querySelector('.note-inline');
    if (status === 'late') {
      noteWrap.classList.add('open');
      
    } else {
      noteWrap.classList.remove('open');
    }
  }

  // 備考入力の保存（500ms後に自動保存）
  function scheduleSave(key, status, note) {
    if (!currentUser.schedules) currentUser.schedules = {};
    currentUser.schedules[key] = { status: status, note: note };
    clearTimeout(saveTimer[key]);
    saveTimer[key] = setTimeout(function() { saveSchedule(); }, 500);
  }

  async function saveSchedule() {
    try {
      await db.collection('users').doc(currentUser.account).update({ schedules: currentUser.schedules });
    } catch(e) {
      console.error('保存エラー:', e.message);
    }
  }

  // ---- OVERVIEW ----
  function changeMonthOv(d) {
    currentMonthOv = new Date(currentMonthOv.getFullYear(), currentMonthOv.getMonth() + d, 1);
    renderOverview();
  }

  async function renderOverview() {
    const y = currentMonthOv.getFullYear(), m = currentMonthOv.getMonth();
    document.getElementById('month-label-ov').textContent = y + '年' + (m+1) + '月';
    const container = document.getElementById('overview-content');
    container.innerHTML = '<p class="loading">読み込み中...</p>';
    try {
      const snap = await db.collection('users').get();
      const users = [];
      snap.forEach(function(d) { users.push({ account: d.id, ...d.data() }); });

      const lastDay = new Date(y, m+1, 0).getDate();

      // 日付ごとにスコア・人数を集計
      const dayData = {};
      for (let d = 1; d <= lastDay; d++) {
        const key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        dayData[key] = { ok:0, late:0, ng:0, tbd:0, score:0 };
        users.forEach(function(u) {
          const e = (u.schedules||{})[key];
          if (e) {
            dayData[key][e.status]++;
            if (e.status === 'ok')   dayData[key].score += 2;
            if (e.status === 'late') dayData[key].score += 1;
          }
        });
      }

      // スコア上位3位以内（同点含む）をすべて強調
      // スコア降順に並べて上位3日を取得
      // この月に通常練習日（アンサンブル以外）があるか確認
      var yearMonth = y + '-' + String(m+1).padStart(2,'0');
      var hasNormalPracticeThisMonth = practices.some(function(p) {
        return !p.ensemble && p.date.indexOf(yearMonth) === 0;
      });
      // 通常練習日がない月のみ緑枠を表示
      var top3 = [];
      if (!hasNormalPracticeThisMonth) {
        var sortedKeys = Object.keys(dayData).filter(function(k) { return dayData[k].score > 0; });
        sortedKeys.sort(function(a, b) { return dayData[b].score - dayData[a].score; });
        var thirdScore = sortedKeys.length >= 3 ? dayData[sortedKeys[2]].score : (sortedKeys.length > 0 ? dayData[sortedKeys[sortedKeys.length-1]].score : 0);
        top3 = sortedKeys.filter(function(k) { return dayData[k].score >= thirdScore; });
      }
      var rankColor = ['#5ec77a', '#5ec77a', '#5ec77a'];

      // カレンダー描画
      const grid = document.createElement('div');
      grid.className = 'my-cal-grid';

      // 曜日ヘッダー
      ['日','月','火','水','木','金','土'].forEach(function(d, i) {
        const h = document.createElement('div');
        h.className = 'day-header' + (i===0?' sun':i===6?' sat':'');
        h.textContent = d; grid.appendChild(h);
      });

      // 空白セル
      const firstDow = new Date(y, m, 1).getDay();
      for (let i = 0; i < firstDow; i++) {
        const e = document.createElement('div'); e.className = 'day-card empty'; grid.appendChild(e);
      }

      // 日付セル
      for (let d = 1; d <= lastDay; d++) {
        const dow = new Date(y, m, d).getDay();
        const today = new Date();
        const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
        const key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const data = dayData[key];
        const rankIdx = top3.indexOf(key);

        const card = document.createElement('div');
        card.className = 'day-card' + (dow===0?' sun':dow===6?' sat':'') + (isToday?' today':'');
        card.dataset.key = key;

        // 通常練習日は赤枠、それ以外で上位は緑枠
        var normalPracticeDates = practices.filter(function(p) { return !p.ensemble; }).map(function(p) { return p.date; });
        if (normalPracticeDates.indexOf(key) !== -1) {
          card.style.borderColor = '#f76a6a';
          card.style.borderWidth = '2px';
        } else if (top3.indexOf(key) !== -1 && data.score > 0) {
          card.style.borderColor = '#5ec77a';
          card.style.borderWidth = '2px';
        }

        // 日付番号
        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = d;
        card.appendChild(num);

        // 集計表示（縦に4つ）
        const counts = document.createElement('div');
        counts.style.cssText = 'width:100%;display:flex;flex-direction:column;gap:2px;';

        [
          { s:'ok',   label:'◯', cls:'status-ok' },
          { s:'late', label:'△', cls:'status-late' },
          { s:'ng',   label:'×', cls:'status-ng' },
          { s:'tbd',  label:'ー', cls:'status-tbd' }
        ].forEach(function(item) {
          const cell = document.createElement('div');
          cell.style.cssText = 'display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:4px;padding:3px 6px;font-size:11px;';
          cell.innerHTML = '<span class="' + item.cls + '">' + item.label + '</span><span style="color:var(--text);font-weight:600;">' + data[item.s] + '</span>';
          counts.appendChild(cell);
        });

        card.appendChild(counts);



        // 日付クリックで詳細モーダルを開く
        (function(dateKey, dateLabel, usersSnap) {
          card.style.cursor = 'pointer';
          card.addEventListener('click', function() {
            openDetailModal(dateKey, dateLabel, usersSnap);
          });
        })(key, y + '年' + (m+1) + '月' + d + '日', users);

        grid.appendChild(card);
      }

      container.innerHTML = '';
      container.appendChild(grid);
    } catch(e) { container.innerHTML = '<p class="loading">エラー: ' + e.message + '</p>'; }
  }

  // ---- DETAIL MODAL ----
  function openDetailModal(key, label, users) {
    var content = document.createElement('div');
    content.innerHTML = '';

    const order = ['ok', 'late', 'ng', 'tbd'];
    const groups = { ok:[], late:[], ng:[], tbd:[], none:[] };

    users.forEach(function(u) {
      const e = (u.schedules || {})[key];
      if (e) {
        groups[e.status].push({ name: u.name || u.account, part: u.part || '', note: e.note || '' });
      } else {
        groups.none.push({ name: u.name || u.account });
      }
    });

    var html = '';

    // ◯△×ーの順に表示
    // ◯と△のみ表示
    var showGroups = [
      { s:'ok',   label:'◯　参加可能' },
      { s:'late', label:'△　遅刻・早退' }
    ];

    showGroups.forEach(function(item) {
      if (groups[item.s].length === 0) return;
      html += '<div style="margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px;">' + item.label + '</div>';
      groups[item.s].forEach(function(u) {
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;">';
        html += '<span style="font-size:13px;"><span style="color:var(--text-muted);font-size:11px;margin-right:6px;">' + (u.part||'') + '</span>' + (u.name||'') + '</span>';
        if (item.s === 'late' && u.note) {
          html += '<span style="font-size:11px;color:var(--late);">' + u.note + '</span>';
        }
        html += '</div>';
      });
      html += '</div>';
    });

    if (!html) html = '<p style="color:var(--text-muted);font-size:13px;">回答がありません</p>';

    content.innerHTML = html;
    var panel = document.getElementById('detail-panel');
    document.getElementById('detail-panel-title').textContent = label;
    document.getElementById('detail-panel-content').innerHTML = html;
    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---- TABS ----
  function switchTab(tabName) {
    document.getElementById('detail-panel').style.display = 'none';
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    const tabEl = document.querySelector('[data-tab="' + tabName + '"]');
    if (tabEl) tabEl.classList.add('active');
    const panelEl = document.getElementById('panel-' + tabName);
    if (panelEl) panelEl.classList.add('active');
    if (tabName === 'overview') renderOverview();
    if (tabName === 'practice') renderPractice();
    if (tabName === 'admin') { renderAdminParts(); renderAdminVenues(); renderAdminUsers(); }
  }

  // ---- ADMIN ----
  function renderAdminParts() {
    const list = document.getElementById('part-list');
    list.innerHTML = '';
    parts.forEach(function(p) {
      const tag = document.createElement('div');
      tag.className = 'part-tag';
      const del = document.createElement('span');
      del.className = 'part-tag-del';
      del.textContent = '×';
      del.addEventListener('click', function() { deletePart(p); });
      tag.textContent = p;
      tag.appendChild(del);
      list.appendChild(tag);
    });
  }

  async function addPart() {
    const input = document.getElementById('new-part-input');
    const name  = input.value.trim();
    if (!name || parts.includes(name)) return;
    parts.push(name);
    await db.collection('settings').doc('parts').set({ list: parts });
    input.value = '';
    renderAdminParts();
  }

  async function deletePart(name) {
    if (!confirm('「' + name + '」を削除しますか？')) return;
    parts = parts.filter(function(p) { return p !== name; });
    await db.collection('settings').doc('parts').set({ list: parts });
    renderAdminParts();
  }

  // ---- USER MANAGEMENT ----
  async function renderAdminUsers() {
    var list = document.getElementById('user-list-admin');
    if (!list) return;
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">読み込み中...</p>';
    try {
      var snap = await db.collection('users').get();
      var users = [];
      snap.forEach(function(d) { users.push({ account: d.id, ...d.data() }); });
      users.sort(function(a,b) { return (a.part||'').localeCompare(b.part||''); });

      if (users.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">ユーザーがいません</p>';
        return;
      }

      list.innerHTML = '';
      users.forEach(function(u) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);';

        var info = document.createElement('div');
        info.innerHTML = '<span style="font-size:11px;color:var(--text-muted);margin-right:6px;">' + (u.part||'-') + '</span>'
          + '<span style="font-size:13px;">' + (u.name||u.account) + '</span>'
          + '<span style="font-size:11px;color:var(--text-muted);margin-left:8px;">@' + u.account + '</span>';

        var delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.style.cssText = 'background:none;border:1px solid #f76a6a;color:#f76a6a;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:"Noto Sans JP",sans-serif;';
        delBtn.addEventListener('click', function() { deleteUser(u.account, u.name||u.account); });

        row.appendChild(info);
        row.appendChild(delBtn);
        list.appendChild(row);
      });
    } catch(e) {
      list.innerHTML = '<p style="color:#f76a6a;font-size:13px;">エラー: ' + e.message + '</p>';
    }
  }

  async function deleteUser(account, name) {
    if (!confirm('「' + name + '」(@' + account + ') を削除しますか？この操作は取り消せません。')) return;
    try {
      await db.collection('users').doc(account).delete();
      renderAdminUsers();
    } catch(e) {
      alert('削除に失敗しました: ' + e.message);
    }
  }

  // ---- EDIT PRACTICE ----
  var editingPracticeIdx = -1;

  function openEditPractice(idx) {
    if (!isAdmin) return;
    editingPracticeIdx = idx;
    var p = practices[idx];
    document.getElementById('edit-practice-date').value     = p.date || '';
    document.getElementById('edit-practice-start').value    = p.start || '';
    document.getElementById('edit-practice-end').value      = p.end || '';
    document.getElementById('edit-practice-song').value     = p.song || '';
    document.getElementById('edit-practice-ensemble').checked = p.ensemble || false;
    // 場所プルダウンを更新
    var sel = document.getElementById('edit-practice-venue');
    sel.innerHTML = '<option value="">場所を選択</option>';
    venues.forEach(function(v) {
      var o = document.createElement('option');
      o.value = v; o.textContent = v;
      if (v === p.venue) o.selected = true;
      sel.appendChild(o);
    });
    document.getElementById('edit-practice-modal').classList.add('open');
  }

  async function saveEditPractice() {
    if (editingPracticeIdx === -1) return;
    var date     = document.getElementById('edit-practice-date').value;
    var start    = document.getElementById('edit-practice-start').value;
    var end      = document.getElementById('edit-practice-end').value;
    var venue    = document.getElementById('edit-practice-venue').value;
    var song     = document.getElementById('edit-practice-song').value.trim();
    var ensemble = document.getElementById('edit-practice-ensemble').checked;
    if (!date) { alert('日付を選択してください'); return; }
    practices[editingPracticeIdx] = { date:date, start:start, end:end, venue:venue, song:song, ensemble:ensemble };
    practices.sort(function(a,b) { return a.date.localeCompare(b.date); });
    await db.collection('settings').doc('practices').set({ list: practices });
    document.getElementById('edit-practice-modal').classList.remove('open');
    renderPractice();
  }

  async function deleteEditPractice() {
    if (editingPracticeIdx === -1) return;
    if (!confirm('この練習日程を削除しますか？')) return;
    practices.splice(editingPracticeIdx, 1);
    await db.collection('settings').doc('practices').set({ list: practices });
    document.getElementById('edit-practice-modal').classList.remove('open');
    renderPractice();
  }

  // ---- SETTINGS ----
  function openSettings() {
    document.getElementById('settings-name-input').value = currentUser.name || '';
    var sel = document.getElementById('settings-part-select');
    sel.innerHTML = '<option value="">パートを選択</option>';
    parts.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p; o.textContent = p;
      if (p === currentUser.part) o.selected = true;
      sel.appendChild(o);
    });
    document.getElementById('settings-msg').style.display = 'none';
    document.getElementById('settings-modal').classList.add('open');
  }

  async function saveSettings() {
    var name = document.getElementById('settings-name-input').value.trim();
    var part = document.getElementById('settings-part-select').value;
    var msg  = document.getElementById('settings-msg');
    msg.style.display = 'block';
    if (!name) { msg.style.color = '#f76a6a'; msg.textContent = '名前を入力してください'; return; }
    if (!part) { msg.style.color = '#f76a6a'; msg.textContent = 'パートを選択してください'; return; }
    try {
      await db.collection('users').doc(currentUser.account).update({ name: name, part: part });
      currentUser.name = name;
      currentUser.part = part;
      document.getElementById('badge-name').textContent = name;
      document.getElementById('badge-part').textContent = part;
      msg.style.color = '#5ec77a'; msg.textContent = '保存しました！';
    } catch(e) { msg.style.color = '#f76a6a'; msg.textContent = 'エラー: ' + e.message; }
  }

  // ---- ADMIN PASSWORD ----
  async function loadAdminPassword() {
    var snap = await db.collection('settings').doc('adminPassword').get();
    if (snap.exists && snap.data().password) ADMIN_PASSWORD = snap.data().password;
  }

  async function changePassword() {
    var current = document.getElementById('current-pw-input').value;
    var newPw   = document.getElementById('new-pw-input').value;
    var confirm = document.getElementById('new-pw-confirm-input').value;
    var msg     = document.getElementById('pw-change-msg');
    msg.style.display = 'block';
    if (current !== ADMIN_PASSWORD) { msg.style.color='#f76a6a'; msg.textContent='現在のパスワードが違います'; return; }
    if (!newPw) { msg.style.color='#f76a6a'; msg.textContent='新しいパスワードを入力してください'; return; }
    if (newPw !== confirm) { msg.style.color='#f76a6a'; msg.textContent='新しいパスワードが一致しません'; return; }
    try {
      await db.collection('settings').doc('adminPassword').set({ password: newPw });
      ADMIN_PASSWORD = newPw;
      document.getElementById('current-pw-input').value = '';
      document.getElementById('new-pw-input').value = '';
      document.getElementById('new-pw-confirm-input').value = '';
      msg.style.color='#5ec77a'; msg.textContent='パスワードを変更しました！';
    } catch(e) { msg.style.color='#f76a6a'; msg.textContent='エラー: '+e.message; }
  }

  // ---- VENUES ----
  var venues = [];

  async function loadVenues() {
    var snap = await db.collection('settings').doc('venues').get();
    if (snap.exists && snap.data().list) {
      venues = snap.data().list;
    } else {
      venues = ['音楽室','体育館','ホール','市民会館'];
      await db.collection('settings').doc('venues').set({ list: venues });
    }
  }

  function renderAdminVenues() {
    var list = document.getElementById('venue-list');
    if (!list) return;
    list.innerHTML = '';
    venues.forEach(function(v) {
      var tag = document.createElement('div');
      tag.className = 'part-tag';
      var del = document.createElement('span');
      del.className = 'part-tag-del';
      del.textContent = '×';
      del.addEventListener('click', function() { deleteVenue(v); });
      tag.textContent = v;
      tag.appendChild(del);
      list.appendChild(tag);
    });
    populateVenueSelect();
  }

  async function addVenue() {
    var input = document.getElementById('new-venue-input');
    var name = input.value.trim();
    if (!name || venues.indexOf(name) !== -1) return;
    venues.push(name);
    await db.collection('settings').doc('venues').set({ list: venues });
    input.value = '';
    renderAdminVenues();
  }

  async function deleteVenue(name) {
    if (!confirm('「' + name + '」を削除しますか？')) return;
    venues = venues.filter(function(v) { return v !== name; });
    await db.collection('settings').doc('venues').set({ list: venues });
    renderAdminVenues();
  }

  function populateVenueSelect() {
    var sel = document.getElementById('practice-venue-input');
    if (!sel) return;
    sel.innerHTML = '<option value="">場所を選択</option>';
    venues.forEach(function(v) {
      var o = document.createElement('option');
      o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }

  // ---- PRACTICE ----
  var practices = [];

  async function loadPractices() {
    var snap = await db.collection('settings').doc('practices').get();
    var list = (snap.exists && snap.data().list) ? snap.data().list : [];
    // 今日の日付（時刻なし）
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayStr = today.getFullYear() + '-'
      + String(today.getMonth()+1).padStart(2,'0') + '-'
      + String(today.getDate()).padStart(2,'0');
    // 過去の日程を除外
    var filtered = list.filter(function(p) { return p.date >= todayStr; });
    // 削除があればFirestoreを更新
    if (filtered.length !== list.length) {
      await db.collection('settings').doc('practices').set({ list: filtered });
    }
    practices = filtered;
  }

  async function addPractice() {
    var date  = document.getElementById('practice-date-input').value;
    var start = document.getElementById('practice-start-input').value;
    var end   = document.getElementById('practice-end-input').value;
    var venue = document.getElementById('practice-venue-input').value;
    var song     = document.getElementById('practice-song-input').value.trim();
    var ensemble = document.getElementById('practice-ensemble-input').checked;
    if (!date) { alert('日付を選択してください'); return; }
    practices.push({ date:date, start:start, end:end, venue:venue, song:song, ensemble:ensemble });
    practices.sort(function(a,b) { return a.date.localeCompare(b.date); });
    await db.collection('settings').doc('practices').set({ list: practices });
    document.getElementById('practice-date-input').value = '';
    document.getElementById('practice-start-input').value = '';
    document.getElementById('practice-end-input').value = '';
    document.getElementById('practice-venue-input').value = '';
    document.getElementById('practice-song-input').value = '';
    document.getElementById('practice-ensemble-input').checked = false;
    renderAdminPracticeList();
    renderPractice();
  }

  async function deletePractice(idx) {
    if (!confirm('この練習日程を削除しますか？')) return;
    practices.splice(idx, 1);
    await db.collection('settings').doc('practices').set({ list: practices });
    renderAdminPracticeList();
    renderPractice();
  }

  function renderAdminPracticeList() {
    var list = document.getElementById('practice-list-admin');
    if (!list) return;
    if (practices.length === 0) { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">登録された練習日程はありません</p>'; return; }
    var html = '';
    practices.forEach(function(p, i) {
      html += '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">';
      html += '<div><div style="font-size:13px;font-weight:500;">' + p.date.replace(/-/g,'/') + '</div>';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">';
      if (p.start||p.end) html += (p.start||'')+(p.end?'〜'+p.end:'')+'　';
      if (p.venue) html += p.venue+'　';
      if (p.song)  html += p.song;
      html += '</div></div>';
      html += '<span class="part-tag-del" onclick="deletePractice('+i+')">×</span></div>';
    });
    list.innerHTML = html;
  }

  async function renderPractice() {
    var container = document.getElementById('practice-content');
    if (!container) return;
    await loadPractices();
    await loadVenues();
    if (isAdmin) renderAdminVenues();

    // 過去の日程を自動削除
    var today = new Date();
    today.setHours(0,0,0,0);
    var todayStr = today.toISOString().slice(0,10);
    var filtered = practices.filter(function(p) { return p.date >= todayStr; });
    if (filtered.length !== practices.length) {
      practices = filtered;
      await db.collection('settings').doc('practices').set({ list: practices });
    }
    if (practices.length === 0) { container.innerHTML = '<p class="loading">練習日程はまだ登録されていません</p>'; return; }
    var html = '';
    practices.forEach(function(p, idx) {
      var cardBg = p.ensemble ? 'background:var(--surface);border:1px solid var(--border);' : 'background:#0d1e3e;border-color:#6a9af7;';
      var cursor = isAdmin ? 'cursor:pointer;' : '';
      var dataIdx = isAdmin ? 'data-practice-idx="' + idx + '"' : '';
      html += '<div style="' + cardBg + 'border-radius:12px;padding:16px;margin-bottom:12px;' + cursor + '" ' + dataIdx + '>';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">';
      html += '<div style="background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;">' + p.date.replace(/-/g,'/') + '</div>';
      if (p.start||p.end) html += '<div style="font-size:13px;color:var(--text-muted);">'+(p.start||'')+(p.end?' 〜 '+p.end:'')+'</div>';
      html += '</div><div style="display:flex;flex-wrap:wrap;gap:8px;">';
      if (p.ensemble) html += '<div style="background:#2d1f6e;border:1px solid #7c6af7;border-radius:20px;padding:3px 12px;font-size:12px;color:#a99df7;">🎼 アンサンブル</div>';
      if (p.venue) html += '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:12px;">📍 '+p.venue+'</div>';
      if (p.song)  html += '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:12px;">🎵 '+p.song+'</div>';
      html += '</div></div>';
    });
    container.innerHTML = html;
    highlightPracticeDays();

    // 管理者の場合カードにタッチイベントを設定
    if (isAdmin) {
      container.querySelectorAll('[data-practice-idx]').forEach(function(card) {
        var idx = parseInt(card.getAttribute('data-practice-idx'));
        var touchStartX, touchStartY;
        card.addEventListener('touchstart', function(e) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
        card.addEventListener('touchend', function(e) {
          var dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
          var dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
          if (dx < 10 && dy < 10) {
            e.preventDefault();
            openEditPractice(idx);
          }
        });
        card.addEventListener('click', function() { openEditPractice(idx); });
      });
    }
  }

  function highlightPracticeDays() {
    // 通常練習日のみ（アンサンブル除く）
    var practiceDates = practices.filter(function(p) { return !p.ensemble; }).map(function(p) { return p.date; });
    document.querySelectorAll('.day-card').forEach(function(card) {
      var key = card.dataset.key;
      if (key && practiceDates.indexOf(key) !== -1) {
        card.style.borderColor = '#f76a6a';
        card.style.borderWidth = '2px';
      }
    });
  }

  // グローバル公開
  window.openEditPractice = openEditPractice;

})();
</script>
</body>
</html>
